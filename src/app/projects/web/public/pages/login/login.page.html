<main class="form-container">
  <section class="form-box auth-card" aria-labelledby="login-title">
    <header class="auth-header">
      <h1 id="login-title">Acesse sua conta</h1>
      <p>Juntos faremos grandes coisas.</p>
    </header>

    <form class="auth-form" [formGroup]="formGroup" (ngSubmit)="submitForm()">
      <div class="auth-field">
        <app-input-text-float formControlName="email" [formGroup]="formGroup" label="E-mail"
          placeholder="Digite seu e-mail"></app-input-text-float>
      </div>

      <div class="auth-field">
        <app-input-password-float formControlName="password" [formGroup]="formGroup" label="Senha"
          placeholder="Digite sua senha"></app-input-password-float>
      </div>

      <div class="auth-actions">
        <app-default-button type="submit" [disabled]="formGroup.invalid">
          Entrar
        </app-default-button>
      </div>

      <div class="auth-switch">
        <a routerLink="/register">Não tem uma conta? Faça seu cadastro</a>
      </div>
    </form>
  </section>
</main>
