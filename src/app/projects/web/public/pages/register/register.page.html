<main class="form-container">
  <section class="form-box auth-card" aria-labelledby="register-title">
    <header class="auth-header">
      <h1 id="register-title">Crie sua conta</h1>
      <p>Comece agora com Pindorama.</p>
    </header>

    <form class="auth-form" [formGroup]="formGroup" (ngSubmit)="submitForm()">

      <div class="auth-field">
        <app-input-text-float formControlName="primaryName" [formGroup]="formGroup" label="Nome Completo"
          placeholder="Seu nome completo"></app-input-text-float>
      </div>

      <div class="auth-field">
        <app-input-text-float formControlName="email" [formGroup]="formGroup" label="E-mail"
          placeholder="Seu e-mail"></app-input-text-float>
      </div>

      <div class="auth-field">
        <app-input-password-float formControlName="password" [formGroup]="formGroup" label="Senha"
          placeholder="Uma senha bem forte"></app-input-password-float>
      </div>

      <div class="auth-field">
        <app-input-password-float formControlName="confirmPassword" [formGroup]="formGroup" label="Confirmar Senha"
          placeholder="Repita a senha"></app-input-password-float>
      </div>

      <div class="auth-actions">
        <app-default-button type="submit" [disabled]="formGroup.invalid">
          Cadastrar
        </app-default-button>
      </div>

      <div class="auth-switch">
        <a [routerLink]="['/login']">Já tem uma conta? Faça login</a>
      </div>
    </form>
  </section>
</main>
