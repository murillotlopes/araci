<main class="form-container">
  <div class="form-box">
    <h2 class="text-center mb-4 txt-primary">Cadastre-se</h2>

    <form [formGroup]="formGroup" (ngSubmit)="submitForm($event)" autocomplete="off">
      <div class="mb-3">
        <app-input-text formControlName="email" [formGroup]="formGroup" label="E-mail"
          placeholder="Seu e-mail"></app-input-text>
      </div>

      <div class="mb-3">
        <app-input-password formControlName="password" [formGroup]="formGroup" label="Senha"
          placeholder="Uma senha bem forte"></app-input-password>
      </div>

      <div class="mb-3">
        <app-input-password formControlName="confirm_password" [formGroup]="formGroup" label="Confirmar Senha"
          placeholder="Repita a senha"></app-input-password>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="formGroup.invalid">
        Cadastrar
      </button>

      <div class="text-center mt-3">
        <a [routerLink]="['/login']">Já tem uma conta? Faça login</a>
      </div>
    </form>
  </div>
</main>
