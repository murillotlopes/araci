<div class="form-text-area-field">
  <label [for]="formControlName">{{ label }}</label>
  <textarea
    [id]="formControlName"
    [value]="value"
    (input)="updateValue($event)"
    (blur)="onTouched()"
    [placeholder]="placeholder"
    [rows]="rows"
    [attr.maxlength]="maxlength ?? null"
    [attr.minlength]="minlength ?? null"
    [class.invalid]="hasError"
    [disabled]="isDisabled"
    [readonly]="readonly"
    [style.resize]="resize"
  ></textarea>
  <app-form-error [control]="control" />
</div>
