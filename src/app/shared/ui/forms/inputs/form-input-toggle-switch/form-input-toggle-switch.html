<div class="form-input-toggle-switch">
  @if (label) {
    <label class="field-label" [for]="inputId">{{ label }}</label>
  }

  <label
    class="toggle-input"
    [class.with-border]="label"
    [class.disabled]="isDisabled"
    [class.invalid]="hasError"
    [for]="inputId"
  >
    <input
      type="checkbox"
      role="switch"
      [id]="inputId"
      [checked]="value"
      [disabled]="isDisabled"
      [attr.aria-checked]="value"
      (change)="toggleValue($event)"
    >
    <span class="toggle-track" aria-hidden="true">
      <span class="toggle-thumb"></span>
    </span>
    @if (placeholder) {
      <span class="toggle-placeholder">{{ placeholder }}</span>
    }
    @if (!placeholder && statusLabel) {
      <span class="toggle-status">{{ statusLabel }}</span>
    }
  </label>

  <app-form-error [control]="control" />
</div>
